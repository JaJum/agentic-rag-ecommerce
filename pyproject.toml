# 工具配置：ruff（静态检查/导入排序）、pytest（Lite 模式可复现测试）
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["frontend", "backend/data", ".venv", "venv"]

[tool.ruff.lint]
# E4/E7/E9：真实语法与运行时风险；F：未定义/未使用；I：导入排序
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"